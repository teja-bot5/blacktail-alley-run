name: Build Blacktail Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cat.fbx is CC0 (Quaternius, Animal Pack Vol.2); see assets/cat/CREDITS.md.
      # shortcut: fetched at build time because it was pushed without a binary-capable client; commit it to drop this step.
      - name: Fetch CC0 cat model
        run: |
          if [ ! -f assets/cat/Cat.fbx ]; then
            curl -sSfL --retry 3 -o /tmp/pack.zip "https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip"
            unzip -j -o /tmp/pack.zip "Animal Pack Vol.2 by @Quaternius/FBX/Cat.fbx" -d assets/cat
          fi
          test "$(stat -c %s assets/cat/Cat.fbx)" = 365628

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Explicit package list: the action's default includes the obsolete "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt' && rm templates.tpz

      - name: Install Godot export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest/"

      - name: Configure Godot for Android export
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Run gameplay tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          GODOT=~/godot/godot tools/run_tests.sh

      - name: Export debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-debug "Android" build/blacktail-alley-run-debug.apk
          test -s build/blacktail-alley-run-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blacktail-alley-run-debug-apk
          path: build/blacktail-alley-run-debug.apk
          if-no-files-found: error
